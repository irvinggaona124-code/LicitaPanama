name: PanamaCompra Sync & Real-Time Alerts

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync_and_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PanamaCompra Sync API
        run: |
          curl -X GET "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/sync-tenders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
